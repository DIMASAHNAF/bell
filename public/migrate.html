    async function executeMigration() {
        const log = document.getElementById('log');
        const status = document.getElementById('status');

        log.textContent += '1. Mengambil data jadwal lama...\n';
        const resAll = await fetch('/api/jadwal/all');
        const existing = await resAll.json();
        log.textContent += `-> Ditemukan ${existing.length} jadwal lama.\n`;

        log.textContent += '2. Menghapus jadwal lama...\n';
        for (const item of existing) {
            await fetch(`/api/jadwal/${item.id}`, { method: 'DELETE' });
        }
        log.textContent += '-> Berhasil membersihkan jadwal lama.\n';

        log.textContent += `3. Menambahkan ${newSchedule.length} jadwal baru (Senin - Jumat)...\n`;
        for (const item of newSchedule) {
            await fetch('/api/jadwal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            });
            log.textContent += `✓ [${item.hari}] ${item.waktu} - ${item.nama_kegiatan} (${item.kategori})\n`;
        }

        log.textContent += '\n=== SELESAI SEMPURNA! ===\n';
        status.innerHTML = '<b style="color: green;">MIGRASI BERHASIL DILAKUKAN! Seluruh jadwal baru aktif.</b>';
    }
